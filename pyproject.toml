[project]
name = "amzsear"
version = "3.0.1"
description = "The unofficial Amazon search CLI & Python API"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Asher Silvers", email = "ashersilvers@gmail.com" }
]
keywords = ["amazon", "search", "product", "products", "python"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.10"
dependencies = [
    "lxml>=4.9.1",
    "cssselect>=1.1.0",
    "requests>=2.20.0",
    "mcp[cli]>=1.27.1",
]

[dependency-groups]
dev = [
    "ruff>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/asherAgs/amzSear"
Repository = "https://github.com/asherAgs/amzSear"

[project.scripts]
amzsear = "amzsear.cli.cli:run"
amzsear-mcp = "amzsear.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/amzsear",
    "/README.md",
    "/LICENSE.txt",
]

[tool.hatch.build.targets.wheel]
packages = ["amzsear"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
